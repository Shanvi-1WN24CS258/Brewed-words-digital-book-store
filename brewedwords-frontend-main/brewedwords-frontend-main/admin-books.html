<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books | Brewed Words Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }
        
        .admin-actions {
            display: flex;
            gap: 1rem;
        }
        
        .admin-btn {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background: var(--gray);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .books-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .admin-book-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px var(--shadow);
            transition: all 0.3s;
        }
        
        .admin-book-card:hover {
            transform: translateY(-5px);
        }
        
        .book-card-header {
            position: relative;
        }
        
        .book-card-header img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .book-card-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }
        
        .action-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .book-card-content {
            padding: 1rem;
        }
        
        .book-meta {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
            grid-column: 1 / -1;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="admin-dashboard.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-book"></i>
                <span>Manage Books</span>
            </a>
        </div>
        
        <div class="nav-tabs">
            <a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="admin-books.html" class="active"><i class="fas fa-book"></i> Books</a>
            <a href="admin-users.html"><i class="fas fa-users"></i> Users</a>
            <a href="admin-settings.html"><i class="fas fa-cog"></i> Settings</a>
        </div>
        
        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <main class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-book"></i> Book Management</h1>
            <div class="admin-actions">
                <a href="admin-add-book.html" class="admin-btn btn-primary">
                    <i class="fas fa-plus"></i> Add Book
                </a>
                <a href="admin-dashboard.html" class="admin-btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Dashboard
                </a>
            </div>
        </div>
        
        <div id="booksList" class="books-list">
            <div class="loading">Loading books...</div>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="admin-management.js"></script>
    <script src="admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check admin access
            if (!checkAdminAccess()) return;
            
            // Load books
            loadAdminBooks();
            
            // Initialize theme
            if (window.sharedData && window.sharedData.initThemeToggle) {
                window.sharedData.initThemeToggle();
            }
        });
        
        function loadAdminBooks() {
            const booksList = document.getElementById('booksList');
            const books = window.sharedData.allBooks || [];
            
            if (!books || books.length === 0) {
                booksList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-book-open"></i>
                        <h3>No Books Found</h3>
                        <p>Add your first book to get started</p>
                        <a href="admin-add-book.html" class="admin-btn btn-primary" style="margin-top: 1rem;">
                            <i class="fas fa-plus"></i> Add First Book
                        </a>
                    </div>
                `;
                return;
            }
            
            let html = '';
            books.forEach(book => {
                html += `
                    <div class="admin-book-card" data-book-id="${book.id}">
                        <div class="book-card-header">
                            <img src="${book.image}" alt="${book.title}">
                            <div class="book-card-actions">
                                <button class="action-btn" onclick="editBook(${book.id})" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="action-btn" onclick="deleteBook(${book.id})" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="book-card-content">
                            <h3 style="margin: 0 0 0.5rem 0;">${book.title}</h3>
                            <p style="color: var(--text-light); margin: 0 0 0.5rem 0;">by ${book.author}</p>
                            <div class="book-meta">
                                <span><i class="fas fa-calendar"></i> ${book.year}</span>
                                <span class="book-genre">${book.genre}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            booksList.innerHTML = html;
        }
        
        function editBook(bookId) {
            alert(`Edit book ${bookId} - Feature coming soon!\n\nFor now, you can delete and re-add the book.`);
        }
        
        function deleteBook(bookId) {
            if (!confirm('Are you sure you want to delete this book? This action cannot be undone.')) {
                return;
            }
            
            if (window.adminDeleteBook) {
                window.adminDeleteBook(bookId);
            } else {
                alert('Admin functions not loaded. Please refresh the page.');
            }
        }
    </script>
</body>
</html>
