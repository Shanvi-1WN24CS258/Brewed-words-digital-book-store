<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book | Brewed Words Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .add-book-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .add-book-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow);
        }
        
        .form-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        
        .form-btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background: var(--gray);
            color: white;
        }
        
        .preview-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border);
        }
        
        .preview-card {
            background: var(--light);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
        }
        
        .image-preview {
            max-width: 150px;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="admin-books.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-plus-circle"></i>
                <span>Add New Book</span>
            </a>
        </div>
        
        <div class="nav-tabs">
            <a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="admin-books.html"><i class="fas fa-book"></i> Books</a>
            <a href="admin-add-book.html" class="active"><i class="fas fa-plus"></i> Add Book</a>
            <a href="admin-settings.html"><i class="fas fa-cog"></i> Settings</a>
        </div>
        
        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <main class="add-book-container">
        <div class="add-book-card">
            <div class="form-header">
                <h1><i class="fas fa-book-medical"></i> Add New Book</h1>
                <p>Fill in the details below to add a new book to the library</p>
            </div>
            
            <form id="addBookForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="bookTitle"><i class="fas fa-heading"></i> Book Title *</label>
                        <input type="text" id="bookTitle" required placeholder="Enter book title">
                    </div>
                    
                    <div class="form-group">
                        <label for="bookAuthor"><i class="fas fa-user-pen"></i> Author *</label>
                        <input type="text" id="bookAuthor" required placeholder="Enter author name">
                    </div>
                    
                    <div class="form-group">
                        <label for="bookYear"><i class="fas fa-calendar"></i> Publication Year</label>
                        <input type="number" id="bookYear" min="1000" max="2024" value="2023" placeholder="2023">
                    </div>
                    
                    <div class="form-group">
                        <label for="bookGenre"><i class="fas fa-tag"></i> Genre *</label>
                        <select id="bookGenre" required>
                            <option value="">Select Genre</option>
                            <option value="Fiction">Fiction</option>
                            <option value="Non-Fiction">Non-Fiction</option>
                            <option value="Mystery">Mystery</option>
                            <option value="Science Fiction">Science Fiction</option>
                            <option value="Fantasy">Fantasy</option>
                            <option value="Romance">Romance</option>
                            <option value="Biography">Biography</option>
                            <option value="History">History</option>
                            <option value="Self-Help">Self-Help</option>
                            <option value="Classic">Classic</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="bookRating"><i class="fas fa-star"></i> Rating (1-5)</label>
                        <input type="number" id="bookRating" min="1" max="5" step="0.1" value="4.0" placeholder="4.0">
                    </div>
                    
                    <div class="form-group">
                        <label for="bookImage"><i class="fas fa-image"></i> Cover Image URL</label>
                        <input type="url" id="bookImage" placeholder="https://example.com/book-cover.jpg">
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="bookSummary"><i class="fas fa-file-alt"></i> Book Summary *</label>
                    <textarea id="bookSummary" rows="4" required placeholder="Enter book summary..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="bookFeatured"> 
                        <i class="fas fa-star"></i> Mark as Featured Book
                    </label>
                </div>
                
                <div class="preview-section">
                    <h3><i class="fas fa-eye"></i> Preview</h3>
                    <div class="preview-card" id="bookPreview">
                        <p>Preview will appear here as you type...</p>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="form-btn btn-secondary" onclick="window.location.href='admin-books.html'">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="submit" class="form-btn btn-primary">
                        <i class="fas fa-save"></i> Add Book
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="shared.js"></script>
    <script src="admin-management.js"></script>
    <script src="admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check admin access
            if (!checkAdminAccess()) return;
            
            // Initialize theme
            if (window.sharedData && window.sharedData.initThemeToggle) {
                window.sharedData.initThemeToggle();
            }
            
            // Setup form submission
            const addBookForm = document.getElementById('addBookForm');
            addBookForm.addEventListener('submit', handleAddBook);
            
            // Setup live preview
            setupLivePreview();
        });
        
        function setupLivePreview() {
            const preview = document.getElementById('bookPreview');
            const inputs = ['bookTitle', 'bookAuthor', 'bookYear', 'bookGenre', 'bookSummary', 'bookImage'];
            
            inputs.forEach(inputId => {
                const input = document.getElementById(inputId);
                if (input) {
                    input.addEventListener('input', updatePreview);
                    input.addEventListener('change', updatePreview);
                }
            });
            
            updatePreview();
        }
        
        function updatePreview() {
            const preview = document.getElementById('bookPreview');
            const title = document.getElementById('bookTitle').value || 'Book Title';
            const author = document.getElementById('bookAuthor').value || 'Author Name';
            const year = document.getElementById('bookYear').value || '2023';
            const genre = document.getElementById('bookGenre').value || 'Fiction';
            const summary = document.getElementById('bookSummary').value || 'Book summary will appear here...';
            const imageUrl = document.getElementById('bookImage').value || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80';
            
            preview.innerHTML = `
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <img src="${imageUrl}" alt="${title}" style="width: 100px; height: 150px; object-fit: cover; border-radius: 5px;">
                    <div>
                        <h3 style="margin: 0 0 0.5rem 0;">${title}</h3>
                        <p style="color: var(--text-light); margin: 0 0 0.5rem 0;">by ${author}</p>
                        <div style="display: flex; gap: 1rem; font-size: 0.9rem; color: var(--text-light);">
                            <span><i class="fas fa-calendar"></i> ${year}</span>
                            <span style="background: var(--primary); color: white; padding: 0.2rem 0.8rem; border-radius: 20px;">${genre}</span>
                        </div>
                    </div>
                </div>
                <p style="margin: 0; line-height: 1.5;">${summary.substring(0, 150)}${summary.length > 150 ? '...' : ''}</p>
            `;
        }
        
        function handleAddBook(e) {
            e.preventDefault();
            
            const bookData = {
                title: document.getElementById('bookTitle').value.trim(),
                author: document.getElementById('bookAuthor').value.trim(),
                year: parseInt(document.getElementById('bookYear').value) || 2023,
                genre: document.getElementById('bookGenre').value,
                rating: parseFloat(document.getElementById('bookRating').value) || 4.0,
                image: document.getElementById('bookImage').value.trim() || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80',
                summary: document.getElementById('bookSummary').value.trim(),
                featured: document.getElementById('bookFeatured').checked
            };
            
            // Validate required fields
            if (!bookData.title || !bookData.author || !bookData.genre || !bookData.summary) {
                alert('Please fill in all required fields (Title, Author, Genre, Summary)');
                return;
            }
            
            // Call adminAddBook function from admin.js
            if (window.adminAddBook) {
                const newBook = window.adminAddBook(bookData);
                
                if (newBook) {
                    alert(`Book "${bookData.title}" added successfully!`);
                    
                    // Log activity
                    if (AdminManager && AdminManager.logActivity) {
                        AdminManager.logActivity('add_book', `Added book: "${bookData.title}"`);
                    }
                    
                    // Redirect to books list
                    setTimeout(() => {
                        window.location.href = 'admin-books.html';
                    }, 1000);
                } else {
                    alert('Failed to add book. Please try again.');
                }
            } else {
                alert('Admin functions not loaded. Please refresh the page.');
            }
        }
    </script>
</body>
</html>
