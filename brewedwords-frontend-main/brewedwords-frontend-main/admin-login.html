<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Brewed Words</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize admin system
    AdminManager.init();
    
    const adminLoginForm = document.getElementById('adminLoginForm');
    
    // If already logged in, redirect to dashboard
    if (AdminManager.checkSession()) {
        window.location.href = 'admin-dashboard.html';
    }
    
    adminLoginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value.trim();
        
        // Validate using AdminManager
        const result = AdminManager.login(email, password);
        
        if (result.success) {
            // Show success message
            if (window.sharedData && window.sharedData.showNotification) {
                window.sharedData.showNotification(result.message, 'success');
            }
            
            // Redirect to admin dashboard
            setTimeout(() => {
                window.location.href = 'admin-dashboard.html';
            }, 1000);
            
        } else {
            if (window.sharedData && window.sharedData.showNotification) {
                window.sharedData.showNotification(result.message, 'error');
            }
        }
    });
});
</script>

    <style>
        .admin-login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }
        
        .admin-login-box {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        
        .admin-login-box h1 {
            color: var(--text);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .admin-login-box h1 i {
            color: var(--danger);
        }
        
        .admin-login-box p {
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .admin-login-btn {
            background: var(--danger);
            color: white;
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        
        .admin-login-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        .back-to-user {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        
        .back-to-user a {
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .back-to-user a:hover {
            text-decoration: underline;
        }
        
        .admin-warning {
            background: rgba(231, 76, 60, 0.1);
            border-left: 4px solid var(--danger);
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 5px;
            text-align: left;
        }
        
        .admin-warning i {
            color: var(--danger);
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-box">
            <h1><i class="fas fa-shield-alt"></i> Admin Portal</h1>
            <p>Restricted access - authorized personnel only</p>
            
            <div class="admin-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <strong>Warning:</strong> Unauthorized access is prohibited
            </div>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail"><i class="fas fa-envelope"></i> Admin Email</label>
                    <input type="email" id="adminEmail" placeholder="admin@brewedwords.com" required>
                </div>
                
                <div class="form-group">
                    <label for="adminPassword"><i class="fas fa-key"></i> Password</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="admin-login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login as Admin
                </button>
            </form>
            
            <div class="back-to-user">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i> Back to User Login
                </a>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const adminLoginForm = document.getElementById('adminLoginForm');
            
            // Hardcoded admin credentials (In real app, use backend authentication)
            const ADMIN_CREDENTIALS = {
                email: "admin@brewedwords.com",
                password: "Admin@123",
                name: "System Administrator",
                role: "admin"
            };
            
            adminLoginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('adminEmail').value;
                const password = document.getElementById('adminPassword').value;
                
                // Simple frontend validation (In real app, verify with backend)
                if (email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password) {
                    // Set admin session
                    localStorage.setItem('isAdmin', 'true');
                    localStorage.setItem('adminUser', JSON.stringify(ADMIN_CREDENTIALS));
                    
                    // Show success message
                    if (window.sharedData && window.sharedData.showNotification) {
                        window.sharedData.showNotification('Admin login successful!', 'success');
                    }
                    
                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                    
                } else {
                    if (window.sharedData && window.sharedData.showNotification) {
                        window.sharedData.showNotification('Invalid admin credentials!', 'error');
                    }
                }
            });
            
            // Initialize theme if exists
            if (window.sharedData && window.sharedData.initThemeToggle) {
                window.sharedData.initThemeToggle();
            }
        });
    </script>
</body>
</html>
