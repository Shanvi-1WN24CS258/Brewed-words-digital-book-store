<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | Brewed Words</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script>
// Simple theme initialization that runs immediately
(function() {
    console.log('Theme initialization starting...');
    
    // 1. Apply saved theme immediately (before DOM is fully loaded)
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    console.log('Immediate theme applied:', savedTheme);
    
    // 2. Wait for DOM, then initialize the toggle button
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, setting up theme toggle...');
        
        if (window.sharedData && window.sharedData.initThemeToggle) {
            try {
                window.sharedData.initThemeToggle();
                console.log('Theme toggle initialized via shared.js');
            } catch (error) {
                console.error('Error in shared.js theme toggle:', error);
                initFallbackTheme();
            }
        } else {
            console.warn('shared.js not loaded, using fallback theme');
            initFallbackTheme();
        }
    });
    
    // Fallback theme function
    function initFallbackTheme() {
        const themeToggle = document.getElementById('themeToggle');
        if (!themeToggle) {
            console.error('Theme toggle button not found for fallback');
            return;
        }
        
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';
        
        // Set icon
        const icon = themeToggle.querySelector('i');
        if (savedTheme === 'light') {
            icon.className = 'fas fa-moon';
        } else {
            icon.className = 'fas fa-sun';
        }
        
        // Add click event
        themeToggle.addEventListener('click', function() {
            const currentTheme = html.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            // Update icon
            const icon = this.querySelector('i');
            if (newTheme === 'light') {
                icon.className = 'fas fa-moon';
            } else {
                icon.className = 'fas fa-sun';
            }
            
            console.log('Fallback theme changed to:', newTheme);
        });
        
        console.log('Fallback theme initialized');
    }
})();
</script>
    <style>
        .book-details-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .book-details {
            display: flex;
            gap: 3rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        
        .book-cover {
            flex: 0 0 300px;
        }
        
        .book-cover img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px var(--shadow);
        }
        
        .book-info-details {
            flex: 1;
            min-width: 300px;
        }
        
        .book-info-details h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }
        
        .book-info-details h3 {
            color: var(--gray);
            margin-bottom: 1.5rem;
            font-weight: 400;
        }
        
        .book-meta-info {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin: 1.5rem 0;
            padding: 1rem 0;
            border-top: 1px solid var(--gray);
            border-bottom: 1px solid var(--gray);
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray);
        }
        
        .meta-item i {
            color: var(--primary);
        }
        
        .book-actions {
            display: flex;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .favorite-btn {
            background-color: var(--danger);
            color: white;
        }
        
        .favorite-btn.active {
            background-color: var(--warning);
        }
        
        .library-btn {
            background-color: var(--primary);
            color: white;
        }
        
        .library-btn.active {
            background-color: var(--secondary);
        }
        
        .book-summary {
            margin: 2rem 0;
            line-height: 1.6;
        }
        
        .book-summary h3 {
            margin-bottom: 1rem;
            color: var(--dark);
        }
        
        .comments-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--gray);
        }
        
        .comments-section h2 {
            margin-bottom: 1.5rem;
            color: var(--dark);
        }
        
        .comment-form {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 5px 15px var(--shadow);
        }
        
        .comment-form h3 {
            margin-bottom: 1rem;
            color: var(--dark);
        }
        
        .comment-form textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--gray);
            border-radius: 5px;
            background-color: var(--light);
            color: var(--dark);
            margin-bottom: 1rem;
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }
        
        .comment-card {
            background-color: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-shadow: 0 3px 10px var(--shadow);
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--gray);
            font-size: 0.9rem;
        }
        
        .comment-content {
            line-height: 1.5;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: var(--light);
        }
        
        .no-comments {
            text-align: center;
            padding: 2rem;
            color: var(--gray);
            font-style: italic;
        }
        
        .rating-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #f39c12;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .book-details {
                flex-direction: column;
                gap: 2rem;
            }
            
            .book-cover {
                flex: 0 0 auto;
                text-align: center;
            }
            
            .book-cover img {
                max-width: 250px;
            }
            
            .book-actions {
                flex-direction: column;
            }
            
            .action-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-book-open"></i>
                <span>Brewed Words</span>
            </a>
        </div>
        
        <div class="nav-tabs">
            <a href="index.html">Home</a>
            <a href="mylibrary.html">My Library</a>
            <a href="favorites.html">Favorites</a>
            <a href="explore.html">Explore</a>
        </div>
        
        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="book-details-container">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> Back to Books
        </button>
        
        <div id="bookDetailsContent">
            <!-- Book details will be loaded here -->
            <div class="loading" style="text-align: center; padding: 3rem;">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Loading book details...</p>
            </div>
        </div>
        
        <div class="comments-section">
            <h2>Comments</h2>
            <div id="commentsList">
                <!-- Comments will be loaded here -->
                <p class="loading">Loading comments...</p>
            </div>
            
            <div class="comment-form" id="commentFormContainer">
                <!-- Comment form will be loaded here if user is logged in -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2023 Brewed Words Online Library. All rights reserved.</p>
        <p>A Web Technology Project</p>
    </footer>

    <!-- Scripts -->
    <script src="shared.js"></script>
    <script src="book-details.js"></script>
    
</body>
</html>
